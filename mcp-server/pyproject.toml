[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dailykeeper-mcp"
version = "0.1.0"
description = "DailyKeeper MCP Server — 把签到状态、任务触发与资源查询暴露给 AI 助手（stdio）"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.2,<2",
    "httpx>=0.27",
]

[project.scripts]
dk-mcp = "dailykeeper_mcp.server:main"

[tool.setuptools.packages.find]
include = ["dailykeeper_mcp*"]
