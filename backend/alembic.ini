[alembic]
# Path to migration scripts (absolute, relative to this file).
script_location = %(here)s/alembic

# Paths, relative to the current working directory, prepended to sys.path
# so that "app" (the backend package) is importable by env.py.
prepend_sys_path = .

# Resolved at runtime by alembic/env.py from DAILYKEEPER_DATABASE_URL or
# app.core.config.get_settings().database_url; left empty here on purpose.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
