[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dailykeeper-server"
version = "0.1.0"
description = "DailyKeeper Server — FastAPI backend, task engine, scheduler, worker"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "APScheduler>=3.10,<4",
    "httpx>=0.27",
    "cryptography>=42",
    "PyJWT>=2.8",
    "alembic>=1.13",
]

[tool.setuptools.packages.find]
include = ["app*"]
