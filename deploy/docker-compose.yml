name: dailykeeper

x-dk-build: &dk-build
  context: ..
  dockerfile: deploy/Dockerfile.backend

x-dk-browser-build: &dk-browser-build
  context: ..
  dockerfile: deploy/Dockerfile.browser

services:
  api:
    build: *dk-build
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - dk-data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  scheduler:
    build: *dk-build
    command: python -m app.scheduler
    env_file: .env
    volumes:
      - dk-data:/app/data
    restart: unless-stopped
    depends_on:
      - api

  worker:
    build: *dk-build
    command: python -m app.worker
    env_file: .env
    volumes:
      - dk-data:/app/data
    restart: unless-stopped
    depends_on:
      - api

  browser-worker:
    build: *dk-browser-build
    env_file: .env
    volumes:
      - dk-data:/app/data
    restart: unless-stopped
    depends_on:
      - api
    mem_limit: 1g

  frontend:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  dk-data:
