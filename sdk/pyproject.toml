[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dailykeeper-sdk"
version = "0.1.0"
description = "DailyKeeper Plugin SDK - build platform plugins for the DailyKeeper automation platform"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
include = ["dailykeeper_sdk*"]
